name: mtg-sim CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Naming any permission sets every other one to none, so read access to the
# repo has to be spelled out. Jobs that push ask for more themselves.
permissions:
  contents: read
  issues: write

jobs:
  lint:
    name: APL lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Registry / handler / deck consistency
        run: python scripts/lint_ci.py
      - name: Report failure
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            const title = `[CI] lint failed — mtg-sim`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              labels: 'needs-fix', state: 'open',
            });
            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number,
                body: `Recurred ${new Date().toISOString().slice(0,10)} — [run](${runUrl})`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, labels: ['needs-fix'],
                body: `**Job:** lint\n**Branch:** ${context.ref.replace('refs/heads/','')}\n**Commit:** \`${context.sha.slice(0,7)}\`\n**Run:** [View logs](${runUrl})\n\nFix before next merge or add to \`harness/IMPERFECTIONS.md\`.`,
              });
            }

  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: pip install requests
      - name: Determinism tests (4 checks)
        run: python tests/test_determinism.py
      - name: Menace combat tests
        run: python tests/test_menace_combat.py
      - name: Report failure
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            const title = `[CI] tests failed — mtg-sim`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              labels: 'needs-fix', state: 'open',
            });
            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number,
                body: `Recurred ${new Date().toISOString().slice(0,10)} — [run](${runUrl})`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, labels: ['needs-fix'],
                body: `**Job:** tests\n**Branch:** ${context.ref.replace('refs/heads/','')}\n**Commit:** \`${context.sha.slice(0,7)}\`\n**Run:** [View logs](${runUrl})\n\nFix before next merge or add to \`harness/IMPERFECTIONS.md\`.`,
              });
            }

  oracle-gate:
    name: Oracle verification (AI gate)
    runs-on: self-hosted
    needs: tests
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Identify changed match APLs
        id: changed
        shell: bash
        run: |
          # One line, space-separated: a multi-line value written as key=value
          # is an invalid output command and failed the step for 2+ APLs.
          FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }} HEAD \
            | grep -E "^apl/.*_match\.py$" | tr '\n' ' ' || true)
          echo "files=$FILES" >> $GITHUB_OUTPUT
          if [ -z "$FILES" ]; then
            echo "No match APLs changed -- oracle gate skipped"
          else
            echo "Changed match APLs:"
            echo "$FILES"
          fi
      - name: Oracle verify changed APLs
        if: steps.changed.outputs.files != ''
        shell: bash
        env:
          HARNESS_ROOT: ${{ vars.HARNESS_ROOT || 'E:/vscode ai project/harness' }}
        run: |
          PASS=0; FAIL=0
          for f in ${{ steps.changed.outputs.files }}; do
            echo "--- Verifying $f ---"
            result=$(python "$HARNESS_ROOT/scripts/verify_oracle.py" --batch "$f" 2>&1)
            echo "$result"
            if echo "$result" | grep -q " FAIL "; then FAIL=$((FAIL+1)); else PASS=$((PASS+1)); fi
          done
          echo "Oracle gate: $PASS PASS, $FAIL FAIL"
          if [ $FAIL -gt 0 ]; then
            echo "::error::Oracle gate failed on $FAIL APL(s)."
            exit 1
          fi
      - name: Report failure
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            const title = `[CI] oracle-gate failed — mtg-sim`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              labels: 'needs-fix', state: 'open',
            });
            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number,
                body: `Recurred ${new Date().toISOString().slice(0,10)} — [run](${runUrl})`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, labels: ['needs-fix'],
                body: `**Job:** oracle-gate\n**Branch:** ${context.ref.replace('refs/heads/','')}\n**Commit:** \`${context.sha.slice(0,7)}\`\n**Run:** [View logs](${runUrl})\n\nGemma found oracle discrepancy in a changed APL. Fix before merge.`,
              });
            }

  handler-regen:
    name: Regenerate standard auto-handlers
    runs-on: self-hosted
    needs: tests
    # Run on every push to main so the generated file stays in sync with
    # oracle_parser.py.
    if: github.event_name == 'push'
    permissions:
      contents: write   # pushes the regenerated file
      issues: write
    steps:
      - uses: actions/checkout@v5
        with:
          # Need write access to auto-commit the regenerated file
          token: ${{ secrets.GITHUB_TOKEN }}
          # Keep gitignored files between runs on the self-hosted runner. The
          # default (clean: true) deleted the Scryfall bulk the build reads.
          clean: false
      # Downloads the bulk if it is missing, refreshes it if it is more than
      # 7 days old, and does nothing otherwise.
      - name: Fetch or refresh Scryfall bulk data
        shell: bash
        run: bash scripts/fetch_scryfall_bulk.sh
      - name: Regenerate standard_auto_handlers.py
        shell: bash
        run: python scripts/build_standard_handlers.py
      - name: Commit if changed
        shell: bash
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --exit-code engine/standard_auto_handlers.py; then
            echo "standard_auto_handlers.py unchanged -- nothing to commit"
          else
            TOTAL=$(python -c "import sys; sys.path.insert(0, '.'); from engine.card_effects import ETB_EFFECTS, SPELL_EFFECTS; print(len(ETB_EFFECTS) + len(SPELL_EFFECTS))" 2>/dev/null || echo "?")
            git add engine/standard_auto_handlers.py
            git commit -m "auto: regenerate standard_auto_handlers.py (total handlers: $TOTAL)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Report failure
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            const title = `[CI] handler-regen failed — mtg-sim`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              labels: 'needs-fix', state: 'open',
            });
            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number,
                body: `Recurred ${new Date().toISOString().slice(0,10)} — [run](${runUrl})`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, labels: ['needs-fix'],
                body: `**Job:** handler-regen\n**Branch:** ${context.ref.replace('refs/heads/','')}\n**Commit:** \`${context.sha.slice(0,7)}\`\n**Run:** [View logs](${runUrl})\n\nRegeneration or auto-commit of standard_auto_handlers.py failed (e.g. python not on PATH on the self-hosted runner, or push perms). Check the runner.`,
              });
            }

  goldfish-guard:
    name: Goldfish baseline guard
    runs-on: self-hosted
    needs: tests
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # pull_request.changed_files is a COUNT, so the old contains() test on
      # it was always false and this job never ran. Ask git for the paths.
      - name: Did the engine or Boros Energy change?
        id: changed
        shell: bash
        run: |
          if git diff --name-only ${{ github.event.pull_request.base.sha }} HEAD \
              | grep -qE "^(engine/|apl/boros_energy)"; then
            echo "run=true" >> $GITHUB_OUTPUT
          else
            echo "run=false" >> $GITHUB_OUTPUT
            echo "No engine/ or apl/boros_energy changes -- goldfish guard skipped"
          fi
      - name: Boros Energy goldfish baseline
        if: steps.changed.outputs.run == 'true'
        shell: bash
        run: |
          # sim.py takes --deck <file>; the old positional "Boros Energy" was
          # rejected by argparse, so this step could never have passed.
          result=$(PYTHONIOENCODING=utf-8 python sim.py --deck decks/boros_energy_modern.txt \
            --n 1000 --seed 42 --no-chart --no-claude 2>&1) || { echo "$result"; exit 1; }
          echo "$result"
          avg=$(echo "$result" | grep -i "avg kill turn" | grep -oE "[0-9]+\.[0-9]+" | head -1)
          echo "Avg kill turn: $avg"
          if [ -z "$avg" ]; then
            echo "::error::could not read the average kill turn from sim.py output"
            exit 1
          fi
          python -c "
          avg = float('$avg')
          if avg < 4.0 or avg > 5.2:
              print(f'FAIL: avg kill turn {avg:.2f} outside expected range [4.0, 5.2]')
              import sys; sys.exit(1)
          print(f'PASS: avg kill turn {avg:.2f} within range')
          "
      - name: Report failure
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            const title = `[CI] goldfish-guard failed — mtg-sim`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              labels: 'needs-fix', state: 'open',
            });
            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number,
                body: `Recurred ${new Date().toISOString().slice(0,10)} — [run](${runUrl})`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, labels: ['needs-fix'],
                body: `**Job:** goldfish-guard\n**Branch:** ${context.ref.replace('refs/heads/','')}\n**Commit:** \`${context.sha.slice(0,7)}\`\n**Run:** [View logs](${runUrl})\n\nBoros Energy kill-turn baseline shifted outside [4.0, 5.2]. Engine regression likely.`,
              });
            }
