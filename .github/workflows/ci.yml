name: mtg-sim CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  issues: write

jobs:
  lint:
    name: APL lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Registry / handler / deck consistency
        run: python scripts/lint_ci.py
      - name: Report failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `[CI] lint failed — mtg-sim`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              labels: 'needs-fix', state: 'open',
            });
            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number,
                body: `Recurred ${new Date().toISOString().slice(0,10)} — [run](${runUrl})`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, labels: ['needs-fix'],
                body: `**Job:** lint\n**Branch:** ${context.ref.replace('refs/heads/','')}\n**Commit:** \`${context.sha.slice(0,7)}\`\n**Run:** [View logs](${runUrl})\n\nFix before next merge or add to \`harness/IMPERFECTIONS.md\`.`,
              });
            }

  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Determinism tests (4 checks)
        run: python tests/test_determinism.py
      - name: Menace combat tests
        run: python tests/test_menace_combat.py
      - name: Report failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `[CI] tests failed — mtg-sim`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              labels: 'needs-fix', state: 'open',
            });
            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number,
                body: `Recurred ${new Date().toISOString().slice(0,10)} — [run](${runUrl})`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, labels: ['needs-fix'],
                body: `**Job:** tests\n**Branch:** ${context.ref.replace('refs/heads/','')}\n**Commit:** \`${context.sha.slice(0,7)}\`\n**Run:** [View logs](${runUrl})\n\nFix before next merge or add to \`harness/IMPERFECTIONS.md\`.`,
              });
            }

  oracle-gate:
    name: Oracle verification (AI gate)
    runs-on: self-hosted
    needs: tests
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Identify changed match APLs
        id: changed
        shell: bash
        run: |
          FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }} HEAD \
            | grep -E "^apl/.*_match\.py$" || true)
          echo "files=$FILES" >> $GITHUB_OUTPUT
          if [ -z "$FILES" ]; then
            echo "No match APLs changed -- oracle gate skipped"
          else
            echo "Changed match APLs:"
            echo "$FILES"
          fi
      - name: Oracle verify changed APLs
        if: steps.changed.outputs.files != ''
        shell: bash
        env:
          HARNESS_ROOT: ${{ vars.HARNESS_ROOT || 'E:/vscode ai project/harness' }}
        run: |
          PASS=0; FAIL=0
          for f in ${{ steps.changed.outputs.files }}; do
            echo "--- Verifying $f ---"
            result=$(python "$HARNESS_ROOT/scripts/verify_oracle.py" --batch "$f" 2>&1)
            echo "$result"
            if echo "$result" | grep -q " FAIL "; then FAIL=$((FAIL+1)); else PASS=$((PASS+1)); fi
          done
          echo "Oracle gate: $PASS PASS, $FAIL FAIL"
          if [ $FAIL -gt 0 ]; then
            echo "::error::Oracle gate failed on $FAIL APL(s)."
            exit 1
          fi
      - name: Report failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `[CI] oracle-gate failed — mtg-sim`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              labels: 'needs-fix', state: 'open',
            });
            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number,
                body: `Recurred ${new Date().toISOString().slice(0,10)} — [run](${runUrl})`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, labels: ['needs-fix'],
                body: `**Job:** oracle-gate\n**Branch:** ${context.ref.replace('refs/heads/','')}\n**Commit:** \`${context.sha.slice(0,7)}\`\n**Run:** [View logs](${runUrl})\n\nGemma found oracle discrepancy in a changed APL. Fix before merge.`,
              });
            }

  goldfish-guard:
    name: Goldfish baseline guard
    runs-on: self-hosted
    needs: tests
    if: |
      github.event_name == 'pull_request' &&
      (contains(github.event.pull_request.changed_files, 'engine/') ||
       contains(github.event.pull_request.changed_files, 'apl/boros_energy'))
    steps:
      - uses: actions/checkout@v4
      - name: Boros Energy goldfish baseline
        shell: bash
        run: |
          result=$(python sim.py "Boros Energy" --n 1000 --seed 42 2>&1)
          echo "$result"
          avg=$(echo "$result" | grep -oP "avg.*?(\d+\.\d+)" | grep -oP "\d+\.\d+" | head -1)
          echo "Avg kill turn: $avg"
          python -c "
          avg = float('$avg')
          if avg < 4.0 or avg > 5.2:
              print(f'FAIL: avg kill turn {avg:.2f} outside expected range [4.0, 5.2]')
              import sys; sys.exit(1)
          print(f'PASS: avg kill turn {avg:.2f} within range')
          "
      - name: Report failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `[CI] goldfish-guard failed — mtg-sim`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              labels: 'needs-fix', state: 'open',
            });
            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number,
                body: `Recurred ${new Date().toISOString().slice(0,10)} — [run](${runUrl})`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, labels: ['needs-fix'],
                body: `**Job:** goldfish-guard\n**Branch:** ${context.ref.replace('refs/heads/','')}\n**Commit:** \`${context.sha.slice(0,7)}\`\n**Run:** [View logs](${runUrl})\n\nBoros Energy kill-turn baseline shifted outside [4.0, 5.2]. Engine regression likely.`,
              });
            }
