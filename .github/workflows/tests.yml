name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: mtg-sim

      - name: Checkout mtg-meta-analyzer (sibling dependency)
        run: git clone --depth 1 https://github.com/Zuxas/mtg-meta-analyzer.git mtg-meta-analyzer

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: mtg-sim
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run match-engine smoke test
        working-directory: mtg-sim
        run: python tests/test_match_engine.py
