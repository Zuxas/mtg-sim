name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  compile:
    name: py_compile all modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile-check all Python modules
        run: |
          find . -name "*.py" \
            -not -path "./.venv/*" \
            -not -path "./venv/*" \
            -not -path "./__pycache__/*" \
            -not -path "*/__pycache__/*" \
            | xargs python -m py_compile

  fast-tests:
    name: Fast deterministic tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Every tests/test_*.py except the slow / card-data / meta-DB tiers
      # listed in scripts/run_tests.py. Prints PASS/FAIL per script.
      - name: Run fast tier
        run: python scripts/run_tests.py
